<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení • InstRagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 350px;
            margin-top: 12px;
        }

        .box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 10px 0;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin: 36px 0 12px;
            font-family: 'Times New Roman', serif; /* Imitace Instagram loga */
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: -1px;
        }

        .login-form {
            width: 100%;
            padding: 0 40px;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            height: 38px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px;
            font-size: 12px;
            margin-bottom: 6px;
            outline: none;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        .btn-login {
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 0;
        }

        .btn-login:disabled {
            background-color: #b2dffc;
            cursor: default;
        }

        .divider-container {
            display: flex;
            align-items: center;
            margin: 10px 0 18px;
            width: 100%;
        }

        .line {
            height: 1px;
            background-color: #dbdbdb;
            flex-grow: 1;
        }

        .or-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
            text-transform: uppercase;
        }

        .fb-login {
            background: none;
            border: none;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .signup-container {
            font-size: 14px;
            padding: 20px 0;
        }

        .signup-link {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #8e8e8e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="box">
            <h1 class="logo">lnstagram</h1>
            
            <form class="login-form">
                <input type="text" placeholder="Telefonní číslo, uživatelské jméno nebo e-mail">
                <input type="password" placeholder="Heslo">
                <button type="submit" class="btn-login">Přihlásit se</button>
                
                <div class="divider-container">
                    <div class="line"></div>
                    <div class="or-text">Nebo</div>
                    <div class="line"></div>
                </div>

                <button type="button" class="fb-login">
                    Přihlásit se přes Facebook without Meta
                </button>

                <a href="#" class="forgot-password">Zapomněli jste heslo?</a>
            </form>
        </div>

        <div class="box signup-container">
            <p>Nemáte účet? <a href="#" class="signup-link">Zaregistrujte se</a></p>
        </div>
    </div>

    <div class="footer">
        © 2026 Instagram from Metr Párna
    </div>

</body>
</html>
